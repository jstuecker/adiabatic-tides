scale_accuracy : 1.0
scale_radial_range : 1.0

units:
  length: 1e6   # parsecs
  mass: 1.0     # solar masses
  velocity: 1.0 # km/s

general:
  rmin: 1e-20
  rmax: 1e20

eddington:
  nintegrate: 100
  nr: 2000

actions:
    # For Action integral:
    nintegrate: 40
    # For mapping rp_ra(j, l) via an interpolation table
    nbins_l: 600
    nbins_pa: 400 # zero means that it uses the same as rp
    substes_pa: 4 # extra steps to determine the rp,ra at fixed lcurves (total steps = nbins_pa*substeps_pa)

    # Less relevant parameters
    eps_circ: 1e-3 # sets when close-to-circular approximations are used. Usually you should not modify this
    j0fac: 1e-5 # Action interpolation behaves linear below j ~ l*j0
    nj : 2000 # Number of j values used for inverting rp(j | l). Is cheap, so keep it large

    # Parameters for finding peri/apocenter radii:
    # The core code does not need this -- they are used in some niece functions
    niter_pa : 30
    search_method : "ridders"
    # These parameters are outdated
    #nsteps_newton: int = 1
    #rafac_max: float = 1e10

adiabatic:
  nr: 200
  ninterp: 120
  nintegrate: 40
  lower_boundary: "initial"
  rminfac: 1e2
  nitermax: 100
  eps_done: 1e-3
  c_spacing: 0.5

sampling:
  nf: 1000
  nsteps_metropolis: 30